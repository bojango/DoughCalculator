name: Fix sandwich loaf salt calculation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sandwich-salt.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sandwich salt calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = """      const yp=read('yeastPct',r.yeastPct[type],.001,15), y=yp/100;\n      const butter=f*.07, sugar=f*.05, salt=f*.02;"""
          new = """      const yp=read('yeastPct',r.yeastPct[type],.001,15), y=yp/100;\n      const s=read('salt',r.salt,0,10)/100;\n      const butter=f*.07, sugar=f*.05, salt=f*s;"""
          if old not in s:
              raise SystemExit('Sandwich salt calculation block not found')
          s = s.replace(old, new, 1)

          old_row = "      addRow('Fine salt','2%',salt);"
          new_row = "      addRow('Fine salt',pct(s*100),salt);"
          if old_row not in s:
              raise SystemExit('Sandwich salt output row not found')
          s = s.replace(old_row, new_row, 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8').replace("dough-calculator-v5", "dough-calculator-v6", 1)
          sw.write_text(sw_text, encoding='utf-8')

          script = re.search(r'<script>\s*(.*?)\s*</script>', s, re.S).group(1)
          Path('/tmp/calculator.js').write_text(script, encoding='utf-8')
          PY
      - name: Check JavaScript
        run: node --check /tmp/calculator.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-sandwich-salt.yml
          git add index.html sw.js
          git commit -m 'Fix sandwich loaf salt percentage calculation'
          git push
