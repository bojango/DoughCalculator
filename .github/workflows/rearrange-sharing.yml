name: Rearrange sharing controls

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rearrange-sharing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        run: python scripts/rearrange_sharing.py
      - name: Check JavaScript
        run: node --check /tmp/calculator.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rearrange-sharing.yml scripts/rearrange_sharing.py
          git add index.html sw.js
          git commit -m 'Move sharing controls below results'
          git push
