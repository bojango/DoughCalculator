name: Add screen wake lock

on:
  push:
    paths:
      - '.github/workflows/add-wake-lock.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          old = ".sharing-panel{display:grid;gap:8px;border-top:1px solid var(--line);padding:8px}\n"
          new = old + ".wake-setting{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--panel2);padding:9px 10px}\n.wake-help{margin-top:3px;font-size:8px;line-height:1.3;color:var(--muted)}\n"
          if '.wake-setting{' not in s:
              assert old in s, 'sharing-panel CSS anchor not found'
              s = s.replace(old, new, 1)

          old = '''              <input id="importFile" class="hidden" type="file" accept="application/json,.json">\n            </div>\n            <details id="savedDetails" class="saved-details">'''
          new = '''              <input id="importFile" class="hidden" type="file" accept="application/json,.json">\n            </div>\n            <div class="wake-setting">\n              <div>\n                <span class="field-label">Keep screen awake</span>\n                <div class="wake-help">While calculator is onscreen</div>\n              </div>\n              <label class="toggle"><input id="wakeOn" type="checkbox"><span class="track"></span></label>\n            </div>\n            <details id="savedDetails" class="saved-details">'''
          if 'id="wakeOn"' not in s:
              assert old in s, 'sharing HTML anchor not found'
              s = s.replace(old, new, 1)

          old = "  const STATE_KEY = 'dough-calculator-last-state-v1';\n"
          new = old + "  const WAKE_KEY = 'dough-calculator-screen-awake-v1';\n"
          if 'const WAKE_KEY' not in s:
              assert old in s, 'STATE_KEY anchor not found'
              s = s.replace(old, new, 1)

          wake_code = r'''
  let wakeLockSentinel = null;

  function wakePreference() {
    try {
      const saved = localStorage.getItem(WAKE_KEY);
      return saved === null ? true : saved === 'true';
    } catch(e) { return true; }
  }

  function saveWakePreference(enabled) {
    try { localStorage.setItem(WAKE_KEY, String(enabled)); } catch(e) {}
  }

  async function acquireWakeLock() {
    if (!wakePreference() || document.visibilityState !== 'visible' || !('wakeLock' in navigator)) return;
    if (wakeLockSentinel && !wakeLockSentinel.released) return;
    try {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
    } catch(e) {
      wakeLockSentinel = null;
    }
  }

  async function releaseWakeLock() {
    if (!wakeLockSentinel) return;
    try { await wakeLockSentinel.release(); } catch(e) {}
    wakeLockSentinel = null;
  }

  async function syncWakeLock() {
    if (wakePreference()) await acquireWakeLock();
    else await releaseWakeLock();
  }

  function initWakeLock() {
    const toggle = $('#wakeOn');
    if (!toggle) return;
    toggle.checked = wakePreference();

    if (!('wakeLock' in navigator)) {
      toggle.checked = false;
      toggle.disabled = true;
      return;
    }

    toggle.addEventListener('change', async () => {
      saveWakePreference(toggle.checked);
      await syncWakeLock();
      $('#status').textContent = toggle.checked ? 'Screen awake on' : 'Screen awake off';
      window.setTimeout(() => $('#status').textContent = '', 1400);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncWakeLock();
    });
    window.addEventListener('pageshow', syncWakeLock);
    document.addEventListener('pointerdown', () => {
      if (wakePreference() && !wakeLockSentinel) acquireWakeLock();
    }, {passive:true});

    syncWakeLock();
  }

'''
          anchor = "  function buildCopyText() {\n"
          if 'function initWakeLock()' not in s:
              assert anchor in s, 'buildCopyText anchor not found'
              s = s.replace(anchor, wake_code + anchor, 1)

          old = "  restoreLastState();\n\n  if ('serviceWorker' in navigator) {"
          new = "  initWakeLock();\n  restoreLastState();\n\n  if ('serviceWorker' in navigator) {"
          if '  initWakeLock();\n  restoreLastState();' not in s:
              assert old in s, 'restoreLastState anchor not found'
              s = s.replace(old, new, 1)

          p.write_text(s)

          sw = Path('sw.js')
          text = sw.read_text()
          text = re.sub(r"const CACHE='dough-calculator-v\\d+';", "const CACHE='dough-calculator-v8';", text, count=1)
          sw.write_text(text)
          PY
      - name: Check JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          js=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S).group(1)
          Path('/tmp/check.js').write_text(js)
          PY
          node --check /tmp/check.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add default-on screen wake lock'
          git push
