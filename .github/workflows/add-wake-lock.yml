name: Add screen wake lock

on: push

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        run: python .github/patch-wake.py
      - name: Check JavaScript
        run: |
          python -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); pathlib.Path('/tmp/check.js').write_text(re.search(r'<script>\\s*(.*?)\\s*</script>',s,re.S).group(1))"
          node --check /tmp/check.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add default-on screen wake lock'
          git push
