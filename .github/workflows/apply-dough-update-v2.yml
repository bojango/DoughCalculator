name: Apply dough calculator update v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-dough-update-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        run: python scripts/patch_calculator_v4.py
      - name: Check JavaScript
        run: node --check /tmp/calculator.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Update white loaf, IDY label and saved recipes'
          git push
